name: Daily Autogrind Research

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC = 11:30am IST
  workflow_dispatch:       # manual trigger anytime

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run researcher
        run: python agents/researcher.py

      - name: Commit if ideas updated
        run: |
          git config user.name "Autogrind Bot"
          git config user.email "autogrind@bot.com"
          git add ideas/ideas.json
          git diff --staged --quiet || git commit -m "🔍 Daily research $(date +'%Y-%m-%d')"
          git push
